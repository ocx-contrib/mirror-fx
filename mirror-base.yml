# Repo-wide policy for the fx mirror.
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# metadata, catalog, tests, versions, announce, annotations — stays in
# fx/mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. This repo
# is single-package, so `platforms:` lives HERE and fx/mirror.yml does not
# restate it — the trap is structurally eliminated rather than merely avoided.

skip_prereleases: true
cascade: true

# New package, so the fleet rule applies unconditionally. A cascade tag
# (`latest`, `39`, `39.2`) re-points on every re-publish; without a build
# segment the new manifest reuses the bare version tag and orphans the prior
# digest for registry GC, breaking any `@sha256:` pin in a consumer's ocx.lock.
# The `none` exception applies only where upstream versions ALREADY carry
# semver build metadata — fx tags bare semver (`39.2.0`), so it does not.
build_timestamp: date

verify:
  github_asset_digest: true

concurrency:
  # Each asset is a single ~17–19 MB static Go binary — an order of magnitude
  # larger than a stripped Rust CLI tarball, so the download fan-out is kept
  # modest rather than copied from a smaller mirror.
  max_downloads: 6
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# `off`, and it cannot be otherwise here. The scan only looks BELOW an
# interface PATH entry of the form ${installPath}/<dir>, and a raw-binary
# mirror has none — the executable IS the content root, so PATH is a bare
# ${installPath}. `auto` or `verify` is rejected at spec load with exit 65
# ("bin_scan is enabled but … declares no interface-visible ${installPath}/<dir>
# PATH entry"). `off` with a hand-listed `binaries` in metadata.json is the
# blessed shape for `asset_type: binary`.
#
# Here that hand-listed claim is LOAD-BEARING BEYOND DOCUMENTATION. GitHub
# serves release assets with no exec bit — every fx asset arrives mode 0644,
# verified on all six in-range Linux artifacts:
#
#   $ gh release download 39.2.0 --repo antonmedv/fx --pattern fx_linux_amd64
#   $ stat -c '%a' fx_linux_amd64   → 644
#
# `prepare` chmods 0755 exactly the binaries metadata.json DECLARES (ocx-mirror
# ≥ 0.5.2). An undeclared binary would therefore ship unexecutable, and
# `bin_scan: auto` cannot rescue it. Quoted so no YAML 1.1 reader folds the
# bare word into boolean `false`.
bin_scan: "off"

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST — it is not a
# label for how it was built. fx is a pure-Go build with no cgo: upstream ships
# ONE Linux binary per arch and both are fully static. Measured on BOTH ends of
# the range and every release between (evidence above fx/mirror.yml's
# `assets:`): 6 artifacts, 2 arches × 3 in-range tags, every one
# "statically linked" with PT_INTERP segment count 0 and zero DT_NEEDED.
#
# Requiring nothing of the host ⇒ BOTH Linux keys are BARE, no `+libc.*`
# suffix. There is no musl/gnu split upstream to choose between, and tagging
# these `+libc.musl` would be a false requirement hiding the package from every
# glibc host it in fact runs on.
#
# A bare key claims universality, so it must PROVE it: ubuntu (glibc) + alpine
# (musl) + fedora (a different glibc vintage). THE ALPINE LEG IS THE PROOF —
# drop it and the universal claim is merely asserted. No `containers[].setup`
# is needed on any leg: zero DT_NEEDED means there is nothing to provision.
#
# Staged rollout (skill Phase 10): darwin and windows are pre-written and
# commented out below AND in fx/mirror.yml's `assets:`, uncommented one pass at
# a time once the Linux legs are end-to-end green. Both halves are commented
# together deliberately — staging `assets:` alone does NOT save runner minutes:
# an unmatched platform self-skips per VERSION but still boots the macos-14 /
# windows runner and reports SUCCESS having tested nothing.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.
  #
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 —
    # GitHub's native macos-13 Intel pool is exhausted and deadlocks push.
    runner: macos-14
    prefix: ["arch", "-x86_64"]
  darwin/arm64:
    runner: macos-14
    shell: bash
  #
  # windows/amd64:
  #   runner: windows-latest
  #   shell: pwsh
  # windows/arm64:
  #   # Native arm64 Windows runner — the amd64 pool cannot execute an ARM64 PE.
  #   runner: windows-11-arm
  #   shell: pwsh

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
